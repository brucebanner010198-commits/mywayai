name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  # vendor/omniroute's package.json pins `"engines": { "node": ">=22.0.0 <25.0.0" }`
  # — Node 24 satisfies that range and matches the version pinned throughout
  # docs/quickstart.md and infra/docker-compose.yml.
  OMNIROUTE_NODE_VERSION: "24"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck every integration package
        run: |
          set -euo pipefail
          for pkg in integrations/*/; do
            name="${pkg%/}"
            echo "::group::typecheck ${name}"
            (cd "${pkg}" && bun run typecheck)
            echo "::endgroup::"
          done

  build-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.OMNIROUTE_NODE_VERSION }}

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      # Caches OmniRoute's npm dependencies AND its prebuilt `.build` output,
      # keyed on the vendored lockfile + every vendored source file. A cache
      # hit skips both `npm ci` and `npm run build` entirely — the slowest
      # step in this workflow (~10 minutes cold).
      - name: Cache OmniRoute build
        id: omniroute-cache
        uses: actions/cache@v4
        with:
          path: |
            vendor/omniroute/node_modules
            vendor/omniroute/.build
          key: omniroute-build-${{ runner.os }}-node${{ env.OMNIROUTE_NODE_VERSION }}-${{ hashFiles('vendor/omniroute/package-lock.json', 'vendor/omniroute/**/*.ts', 'vendor/omniroute/**/*.tsx', 'vendor/omniroute/**/*.mjs', 'vendor/omniroute/**/*.cjs') }}

      - name: Build OmniRoute
        if: steps.omniroute-cache.outputs.cache-hit != 'true'
        working-directory: vendor/omniroute
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm ci
          npm run build

      - name: make e2e
        run: make e2e
